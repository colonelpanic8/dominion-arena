name: CI

on:
  push:
    branches: [master]
  pull_request:

# A push to a pull request cancels its earlier run; every push to master runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # rust-cache needs cargo and rustc on PATH to key and clean the cache.
      - name: Put the dev shell's toolchain on PATH
        run: nix develop --command bash -c 'dirname "$(command -v cargo)"' >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: Format, lint and test
        run: nix develop --command just check

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Flake check
        run: nix flake check
